name: Deploy Pilot
on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full commit SHA already validated by CI
        required: true
permissions: { id-token: write, contents: read, actions: read }
concurrency:
  group: casaviva-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    timeout-minutes: 30
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: "${{ inputs.git_sha }}"
          fetch-depth: 0
      - name: Require the deployment SHA to belong to main
        shell: bash
        run: |
          set -Eeuo pipefail
          sha='${{ inputs.git_sha }}'
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "Refusing to deploy $sha because it is not reachable from origin/main." >&2
            exit 1
          }
      - name: Require successful CI for the exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha='${{ inputs.git_sha }}'
          conclusion="$(gh run list --workflow CI --commit "$sha" --json conclusion --jq '.[0].conclusion // ""')"
          test "$conclusion" = success || { echo "CI is not successful for $sha" >&2; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v5
        with: { role-to-assume: "${{ vars.AWS_DEPLOY_ROLE_ARN }}", aws-region: mx-central-1 }
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build or reuse immutable backend image
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          registry="$account.dkr.ecr.mx-central-1.amazonaws.com"
          sha='${{ inputs.git_sha }}'
          repo=casaviva-backend
          if digest="$(aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$sha" --query 'imageDetails[0].imageDigest' --output text 2>/tmp/ecr-error)"; then
            if [[ -n "$digest" && "$digest" != "None" ]]; then
              echo "Reusing existing immutable $repo:$sha ($digest)"
              exit 0
            fi
          elif ! grep -q 'ImageNotFoundException' /tmp/ecr-error; then
            cat /tmp/ecr-error >&2
            exit 1
          fi
          {
            echo "Building $repo:$sha (linux/arm64)"
            docker buildx build --progress=plain --platform linux/arm64 -f docker/backend.Dockerfile -t "$registry/$repo:$sha" --push .
          }
      - name: Build or reuse immutable frontend image
        timeout-minutes: 20
        run: |
          set -Eeuo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          registry="$account.dkr.ecr.mx-central-1.amazonaws.com"
          sha='${{ inputs.git_sha }}'
          repo=casaviva-frontend
          if digest="$(aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$sha" --query 'imageDetails[0].imageDigest' --output text 2>/tmp/ecr-error)"; then
            if [[ -n "$digest" && "$digest" != "None" ]]; then
              echo "Reusing existing immutable $repo:$sha ($digest)"
              exit 0
            fi
          elif ! grep -q 'ImageNotFoundException' /tmp/ecr-error; then
            cat /tmp/ecr-error >&2
            exit 1
          fi
          {
            echo "Building $repo:$sha (linux/arm64)"
            docker buildx build --progress=plain --platform linux/arm64 --build-arg MEDIA_REMOTE_HOSTNAME='${{ vars.MEDIA_REMOTE_HOSTNAME }}' --build-arg NEXT_PUBLIC_ANTIBOT_ENABLED='${{ vars.ANTIBOT_ENABLED }}' --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY='${{ vars.TURNSTILE_SITE_KEY }}' -f docker/frontend.Dockerfile -t "$registry/$repo:$sha" --push .
          }
      - name: Build and publish immutable private ops bundle
        run: |
          set -Eeuo pipefail
          sha='${{ inputs.git_sha }}'
          ./scripts/build-ops-bundle.sh "$sha" dist
          aws s3 cp "dist/casaviva-ops-$sha.tar.gz" "s3://${{ vars.OPS_BUCKET_NAME }}/ops/$sha/casaviva-ops-$sha.tar.gz" --only-show-errors
          aws s3 cp "dist/casaviva-ops-$sha.tar.gz.sha256" "s3://${{ vars.OPS_BUCKET_NAME }}/ops/$sha/casaviva-ops-$sha.tar.gz.sha256" --only-show-errors
      - name: Deploy through SSM
        run: |
          set -Eeuo pipefail
          sha='${{ inputs.git_sha }}'
          ops_uri="s3://${{ vars.OPS_BUCKET_NAME }}/ops/$sha"
          remote="sudo /opt/casaviva/bin/install-ops-bundle.sh $sha $ops_uri && if sudo test -f /opt/casaviva/shared/bootstrap_release; then sudo /opt/casaviva/bin/deploy.sh $sha; else sudo /opt/casaviva/bin/first-install.sh $sha; fi"
          command_id="$(aws ssm send-command --instance-ids '${{ vars.PILOT_INSTANCE_ID }}' --document-name AWS-RunShellScript --parameters commands="$remote" --query Command.CommandId --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id '${{ vars.PILOT_INSTANCE_ID }}'
          aws ssm get-command-invocation --command-id "$command_id" --instance-id '${{ vars.PILOT_INSTANCE_ID }}'
