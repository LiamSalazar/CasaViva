name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements/development.txt }
      - run: npm ci
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/pip install -r backend/requirements/development.txt pip-audit
      - run: ./scripts/verify.sh
      - run: npm audit --audit-level=high
      - run: backend/.venv/bin/pip-audit -r backend/requirements/production.txt
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, severity: HIGH,CRITICAL, exit-code: "1" }
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.13.5 }
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/environments/pilot init -backend=false
      - run: terraform -chdir=infra/environments/pilot validate
      - uses: terraform-linters/setup-tflint@v5
      - run: tflint --chdir=infra/environments/pilot --recursive
      - uses: bridgecrewio/checkov-action@a8664e3a0549367977f0cda990a34311835c87c0 # v12.3123.0 (Docker action; no runner Node dependency)
        with: { directory: infra, framework: terraform }
